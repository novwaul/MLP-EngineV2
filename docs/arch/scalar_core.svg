<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">

<style>
  .bg    { fill: #ffffff; }
  .top   { fill: #f6f8fb; stroke: #6b7785; stroke-width: 2; stroke-dasharray: 8 5; }
  .logic { fill: #dceaff; stroke: #3b6fb6; stroke-width: 1.6; }
  .inner { fill: #ffffff; stroke: #3b6fb6; stroke-width: 1.2; }
  .reg   { fill: #fff3b8; stroke: #b39500; stroke-width: 1.4; }
  .sram  { fill: #ffe0bf; stroke: #d27a1e; stroke-width: 1.6; }
  .sramc { fill: #fff6ec; stroke: #d27a1e; stroke-width: 1.6; }
  .acc   { fill: #def5e1; stroke: #2f8f45; stroke-width: 1.6; }
  .acci  { fill: #ffffff; stroke: #2f8f45; stroke-width: 1.2; }
  .pe    { fill: #b9e7c2; stroke: #2f8f45; stroke-width: 1.2; }
  .ext   { fill: #eceff2; stroke: #7a838c; stroke-width: 1.6; }
  .wire  { stroke: #33414f; stroke-width: 1.8; fill: none; }
  .bus   { stroke: #33414f; stroke-width: 4; fill: none; }
  .bc    { stroke: #2f8f45; stroke-width: 1.6; fill: none; }
  text   { font-family: Helvetica, Arial, sans-serif; fill: #1d2730; }
  .h     { font-size: 20px; font-weight: bold; }
  .t     { font-size: 15px; font-weight: bold; }
  .s     { font-size: 12.5px; }
  .xs    { font-size: 11px; fill: #45525e; }
  .lbl   { font-size: 11.5px; fill: #33414f; font-style: italic; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#33414f"/>
  </marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2f8f45"/>
  </marker>
</defs>

<rect width="100%" height="100%" class="bg"/>
<text x="20" y="34" class="h" text-anchor="start">scalar_core  —  CPU_TOP</text>
<rect x="20" y="52" width="960" height="340" rx="12" class="top"/>
<text x="34" y="74" class="xs" text-anchor="start">CPU_TOP</text>
<rect x="50" y="90" width="320" height="230" rx="10" class="logic"/>
<text x="64" y="114" class="t" text-anchor="start">INSTR_CACHE</text>
<text x="64" y="132" class="xs" text-anchor="start">direct-mapped, 128 lines × 32-bit</text>
<rect x="64" y="146" width="138.0" height="50" rx="8" class="inner"/>
<text x="133.0" y="168.5" class="s" text-anchor="middle">Cache FSM</text>
<text x="133.0" y="186.5" class="s" text-anchor="middle">Idle/Read/Write/Reset</text>
<rect x="218.0" y="146" width="138.0" height="50" rx="8" class="reg"/>
<text x="287.0" y="168.5" class="s" text-anchor="middle">latched_instr</text>
<text x="287.0" y="186.5" class="s" text-anchor="middle">last hit</text>
<text x="64" y="218" class="xs" text-anchor="start">CACHE_SRAM: 56-bit {valid, tag, data}</text>
<rect x="64" y="226" width="138.0" height="78" rx="8" class="sram"/>
<text x="133.0" y="255.0" class="s" text-anchor="middle">u_sram_lo</text>
<text x="133.0" y="273.0" class="s" text-anchor="middle">sky130_sram_1kbyte</text>
<text x="133.0" y="288.0" class="s" text-anchor="middle">1rw1r_32x256_8</text>
<rect x="218.0" y="226" width="138.0" height="78" rx="8" class="sram"/>
<text x="287.0" y="255.0" class="s" text-anchor="middle">u_sram_hi</text>
<text x="287.0" y="273.0" class="s" text-anchor="middle">sky130_sram_1kbyte</text>
<text x="287.0" y="288.0" class="s" text-anchor="middle">1rw1r_32x256_8</text>
<rect x="520" y="90" width="430" height="270" rx="10" class="logic"/>
<text x="534" y="114" class="t" text-anchor="start">SCALAR_CORE</text>
<text x="534" y="132" class="xs" text-anchor="start">RV32IM + Zicsr, multi-cycle</text>
<rect x="540" y="145" width="390" height="58" rx="8" class="inner"/>
<text x="735.0" y="171.5" class="t" text-anchor="middle">DECODER</text>
<text x="735.0" y="189.5" class="s" text-anchor="middle">FSM:  Fetch → Execute → Dmem | Jump → Fetch</text>
<rect x="540" y="218" width="120" height="54" rx="8" class="reg"/>
<text x="600.0" y="250.0" class="s" text-anchor="middle">PC / IADDR</text>
<rect x="675" y="218" width="120" height="54" rx="8" class="inner"/>
<text x="735.0" y="242.5" class="s" text-anchor="middle">REGFILE</text>
<text x="735.0" y="260.5" class="s" text-anchor="middle">32 × 32</text>
<rect x="810" y="218" width="120" height="54" rx="8" class="inner"/>
<text x="870.0" y="242.5" class="s" text-anchor="middle">ALU</text>
<text x="870.0" y="260.5" class="s" text-anchor="middle">incl. MUL / MULH*</text>
<rect x="540" y="286" width="120" height="54" rx="8" class="inner"/>
<text x="600.0" y="310.5" class="s" text-anchor="middle">CSR</text>
<text x="600.0" y="328.5" class="s" text-anchor="middle">mcycle, minstret</text>
<text x="680" y="310" class="xs" text-anchor="start">dmem_addr_o = ALU result</text>
<text x="680" y="326" class="xs" text-anchor="start">(no output register)</text>
<path d="M370,165 L520,165" class="wire" marker-end="url(#a)"/>
<text x="445.0" y="159" class="lbl" text-anchor="middle">instr, hit</text>
<path d="M520,199 L370,199" class="wire" marker-end="url(#a)"/>
<text x="445.0" y="193" class="lbl" text-anchor="middle">addr, read</text>
<rect x="150" y="490" width="700" height="72" rx="8" class="ext"/>
<text x="500.0" y="523.5" class="t" text-anchor="middle">External memory  (MEMORY_TOP, testbench)</text>
<text x="500.0" y="541.5" class="s" text-anchor="middle">one request served every 4 cycles</text>
<path d="M210,320 L210,490" class="wire" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="220" y="445" class="lbl" text-anchor="start">imem_*  (cache refill)</text>
<path d="M870,360 L870,420 L760,420 L760,490" class="wire" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="770" y="445" class="lbl" text-anchor="start">dmem_*  (load / store)</text>
<rect x="20" y="600" width="18" height="14" rx="3" class="logic"/>
<text x="44" y="612" class="xs" text-anchor="start">logic</text>
<rect x="86.0" y="600" width="18" height="14" rx="3" class="reg"/>
<text x="110.0" y="612" class="xs" text-anchor="start">register</text>
<rect x="173.6" y="600" width="18" height="14" rx="3" class="sram"/>
<text x="197.6" y="612" class="xs" text-anchor="start">SRAM macro</text>
<rect x="275.6" y="600" width="18" height="14" rx="3" class="ext"/>
<text x="299.6" y="612" class="xs" text-anchor="start">outside the chip</text>
</svg>
